name: CI
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "schemas/patches/**"
      - "schemas/manual/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "schemas/patches/**"
      - "schemas/manual/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: pytest tests/ -v
